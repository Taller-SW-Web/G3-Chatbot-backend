# Alembic — Canal Chatbot (H2-01)
# Convención hito-2.md: revisiones secuenciales 4 dígitos, primera 0001.
# Se genera SOLO con: alembic revision --autogenerate --rev-id 0001 -m "initial schema"
# Solo Sebastian genera migraciones (H2-10). Nunca editar/renumerar mergeadas.

[alembic]
script_location = src/infrastructure/db/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
