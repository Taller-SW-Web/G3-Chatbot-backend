sonar.organization=taller-sw-web
sonar.projectKey=G3-Chatbot-backend
sonar.projectName=G3-Chatbot Backend
sonar.sources=src
sonar.tests=tests
# Sin esto el escáner asume 3.10–3.14 y avisa; la CI usa 3.12.
sonar.python.version=3.12
# Cobertura combinada: unitarias (`coverage.xml`) + integración
# (`coverage-integration.xml`). Sonar suma las líneas cubiertas por cualquiera de
# los dos; sin la segunda, los adapters de Postgres parecían sin probar.
sonar.python.coverage.reportPaths=coverage.xml,coverage-integration.xml
sonar.exclusions=**/__pycache__/**,src/infrastructure/db/migrations/**,src/adapters/outbound/fakes/seeds/**
# El escaneo espera el Quality Gate: si falla, el job falla (gate real).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
