name: Verify production

# Runs after Railway reports the result of a production deployment, so it never blocks the deploy.
# It lives outside the CI workflow on purpose: a deploy that waits for CI checks would otherwise
# wait for this job, while this job waits for the deploy.
on:
  deployment_status:
  workflow_dispatch:

env:
  BACKEND_URL: https://g3-chatbot-backend.up.railway.app

jobs:
  verify:
    name: Verify production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'G3-Chatbot / production' &&
       contains(fromJSON('["success", "failure", "error"]'), github.event.deployment_status.state))
    steps:
      - name: Fail when the Railway deployment failed
        if: github.event_name == 'deployment_status' && github.event.deployment_status.state != 'success'
        run: |
          echo "::error::Railway deployment of ${GITHUB_SHA::7} ended in '${{ github.event.deployment_status.state }}'."
          exit 1

      - name: Health check responds ok
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 "$BACKEND_URL/health")
          echo "GET /health -> $body"
          test "$(echo "$body" | jq -r .status)" = "ok"

      - name: OpenAPI schema is served
        run: |
          paths=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 "$BACKEND_URL/openapi.json" | jq '.paths | length')
          echo "OpenAPI paths: $paths"
          test "$paths" -gt 0
