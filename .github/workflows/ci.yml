name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

env:
  PYTHONPATH: .

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.17.2
      - name: Lint
        run: ruff check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit

  openapi:
    name: Export OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py --output docs/openapi.json
      - name: Upload OpenAPI schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi.json
          if-no-files-found: error

  integration-tests:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL 18 for native uuidv7(), as the integration tests require.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check migrations (upgrade, downgrade, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run integration tests
        run: python -m pytest tests/integration

  # `test` is the required status check of the protected branches, so it stays as the
  # single gate. It runs even when a job fails, because a skipped required check counts as passed.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, openapi, integration-tests]
    if: always()
    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."

  # Runs only on pushes to main, after the gate. Railway deploys main without waiting for CI,
  # so this job can wait for the Railway deployment of this commit and then check production.
  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      deployments: read
    env:
      BACKEND_URL: https://g3-chatbot-backend.up.railway.app
      RAILWAY_ENVIRONMENT: G3-Chatbot / production
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the Railway deployment of this commit
        run: |
          for attempt in $(seq 1 60); do
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=$(jq -rn --arg e "$RAILWAY_ENVIRONMENT" '$e|@uri')" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state // "pending"')
              echo "Attempt $attempt: Railway deployment $id is '$state'."
              case "$state" in
                success) exit 0 ;;
                failure|error) echo "::error::Railway deployment of ${GITHUB_SHA::7} ended in '$state'."; exit 1 ;;
              esac
            else
              echo "Attempt $attempt: no Railway deployment for ${GITHUB_SHA::7} yet."
            fi
            sleep 15
          done
          echo "::error::Railway did not finish deploying ${GITHUB_SHA::7} within 15 minutes."
          exit 1

      - name: Health check responds ok
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 "$BACKEND_URL/health")
          echo "GET /health -> $body"
          test "$(echo "$body" | jq -r .status)" = "ok"

      - name: OpenAPI schema is served
        run: |
          paths=$(curl -fsS --retry 3 --retry-delay 5 --max-time 20 "$BACKEND_URL/openapi.json" | jq '.paths | length')
          echo "OpenAPI paths: $paths"
          test "$paths" -gt 0
