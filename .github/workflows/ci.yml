name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  schedule:
    # Full weekly run: catches CVEs and drift that a diff-scoped PR cannot see.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full pipeline regardless of the diff"
        type: boolean
        default: true

# Least privilege: the workflow only reads the repository. The notify job
# elevates pull-requests/actions permissions for its own scope.
permissions:
  contents: read

# A newer push on the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  # Cheap job that decides what the expensive jobs must do. GitHub has no
  # `changes` filter per job, so the scope is computed once and consumed with
  # `needs.scope.outputs.*`.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full: ${{ steps.scope.outputs.full }}
      modules: ${{ steps.scope.outputs.modules }}
      integration_shards: ${{ steps.scope.outputs.integration_shards }}
      run_validate: ${{ steps.scope.outputs.run_validate }}
      run_unit: ${{ steps.scope.outputs.run_unit }}
      run_integration: ${{ steps.scope.outputs.run_integration }}
      run_docker: ${{ steps.scope.outputs.run_docker }}
      run_security: ${{ steps.scope.outputs.run_security }}
      run_dast: ${{ steps.scope.outputs.run_dast }}
      run_gateway: ${{ steps.scope.outputs.run_gateway }}
      run_sonar: ${{ steps.scope.outputs.run_sonar }}
      run_specs: ${{ steps.scope.outputs.run_specs }}
      run_dependency_review: ${{ steps.scope.outputs.run_dependency_review }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compute scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          args=(--event "$EVENT_NAME")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            args+=(--base "origin/$BASE_REF")
          elif [ "$EVENT_NAME" = "push" ]; then
            args+=(--before "$BEFORE_SHA")
          else
            args+=(--full)
          fi
          if [ "$INPUT_FULL" = "true" ] || printf '%s' ",$LABELS," | grep -q ',ci:full,'; then
            args+=(--full)
          fi
          python scripts/ci/scope.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

  # One job for every blocking validator: the developer sees all errors at once
  # and the runner pays the setup once. The report is kept as evidence for 90 days.
  validate:
    name: Validate
    needs: scope
    if: needs.scope.outputs.run_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install validators
        run: pip install -r requirements.txt ruff==0.17.2 mypy
      - name: Run validators
        run: python scripts/ci/run_validators.py --report validation-report.txt
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.txt
          retention-days: 90
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    needs: [scope, validate]
    if: |
      always() && needs.scope.outputs.run_unit == 'true' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit --cov=src --cov-report=xml --cov-report=term
      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: error

  # Dynamic matrix: only the shards with something to run are created. Each leg
  # owns its services (Postgres + RabbitMQ); there is no shared state.
  integration-tests:
    name: Integration (${{ matrix.shard }})
    needs: [scope, validate, unit-tests]
    if: |
      always() && needs.scope.outputs.run_integration == 'true' &&
      needs.validate.result == 'success' &&
      needs.unit-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.integration_shards) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
      RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672/
      COVERAGE_FILE: .coverage.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare database
        run: |
          alembic upgrade head
          if [ "${{ matrix.shard }}" = "core" ]; then
            # The up/down/up gate runs once, not once per shard.
            alembic downgrade base
            alembic upgrade head
          fi
      - name: Run integration tests
        run: |
          if [ "${{ matrix.shard }}" = "core" ]; then
            python -m pytest \
              tests/integration/test_outbox_consumer_rabbitmq.py \
              tests/integration/test_rabbitmq_outbox_publisher.py \
              tests/integration/test_gateway_kong.py \
              --cov=src --cov-report= --cov-fail-under=0
          else
            python -m pytest "tests/integration/${{ matrix.shard }}" \
              --cov=src --cov-report= --cov-fail-under=0
          fi
      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  coverage-merge:
    name: Merge integration coverage
    needs: integration-tests
    if: needs.integration-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install coverage
        run: pip install "coverage[toml]"
      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: integration-coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine coverage
        # The global 85% floor belongs to the unit job. This report only feeds
        # Sonar, which evaluates the combined new-code coverage afterwards.
        run: |
          coverage combine coverage-data
          coverage xml --fail-under=0 -o coverage-integration.xml
      - name: Upload integration coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: error

  docker:
    name: Dockerfile + Trivy
    needs: scope
    if: needs.scope.outputs.run_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
      - name: hadolint (gateway)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: gateway/Dockerfile
          failure-threshold: error
      - name: Trivy (vulnerabilidades y configuración)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Build image
        run: docker build --tag g3-chatbot-backend:ci .
      - name: Build gateway image
        run: docker build --file gateway/Dockerfile --tag g3-chatbot-gateway:ci gateway
      - name: Trivy (gateway image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: g3-chatbot-gateway:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

  security:
    name: Dependency audit
    needs: scope
    if: needs.scope.outputs.run_security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit requirements (blocking)
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt

  # Expensive runtime checks do not run on every PR: they run on development,
  # the weekly schedule, or when the PR carries the `ci:full` label.
  dast:
    name: DAST (OWASP ZAP)
    needs: [scope, validate, unit-tests]
    if: |
      always() && needs.scope.outputs.run_dast == 'true' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_dast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare environment (fake modules and scripted LLM)
        run: |
          sed -e 's#^DATABASE_URL=.*#DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_dast#' \
              -e 's#^LLM_PROVIDER=.*#LLM_PROVIDER=fake#' \
              .env.template > .env
          alembic upgrade head
      - name: Start backend
        run: |
          nohup uvicorn src.infrastructure.main:app --host 127.0.0.1 --port 8000 --env-file .env \
            > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat uvicorn.log
          exit 1
      - name: Run OWASP ZAP baseline & OpenAPI passive scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          set +e
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            -v "$PWD/.zap:/zap/config:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://127.0.0.1:8000/openapi.json \
              -f openapi \
              -S \
              -c /zap/config/rules.tsv \
              -r zap-api-report.html \
              -J zap-api-report.json \
              -w zap-api-report.md
          api_status=$?
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            -v "$PWD/.zap:/zap/config:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:8000/health \
              -c /zap/config/rules.tsv \
              -r zap-health-report.html \
              -J zap-health-report.json \
              -w zap-health-report.md
          health_status=$?
          set -e
          echo "ZAP API exit=$api_status; ZAP baseline exit=$health_status"
          for status in "$api_status" "$health_status"; do
            if [ "$status" -gt 2 ]; then
              echo "::error::OWASP ZAP no pudo completar el escaneo (exit $status)"
              exit 1
            fi
          done
      - name: Evaluate ZAP reports (fail on High findings)
        id: zap_gate
        run: |
          set +e
          python scripts/check_zap_report.py \
            --report zap-reports/zap-api-report.json \
            --report zap-reports/zap-health-report.json \
            --rules .zap/rules.tsv \
            --exceptions-doc docs/seguridad/zap-exceptions.md \
            --summary-output zap-reports/summary.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish ZAP summary
        if: always()
        run: |
          if [ -f zap-reports/summary.md ]; then
            cat zap-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload ZAP DAST reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-zap-report
          path: |
            zap-reports/
            uvicorn.log
          if-no-files-found: error
      - name: Enforce High-severity gate
        if: always()
        run: test "${{ steps.zap_gate.outputs.exit_code }}" = "0"

  gateway-integration:
    name: Gateway integration (Kong OSS)
    needs: [scope, validate, unit-tests]
    if: |
      always() && needs.scope.outputs.run_gateway == 'true' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_gateway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare environment (fake modules and scripted LLM)
        run: |
          sed -e 's#^DATABASE_URL=.*#DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_gateway#' \
              -e 's#^LLM_PROVIDER=.*#LLM_PROVIDER=fake#' \
              .env.template > .env
          alembic upgrade head
      - name: Start backend
        run: |
          nohup uvicorn src.infrastructure.main:app --host 127.0.0.1 --port 8000 --env-file .env \
            > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat uvicorn.log
          exit 1
      - name: Build and start Kong OSS gateway
        run: |
          docker build --file gateway/Dockerfile --tag g3-chatbot-gateway:ci gateway
          docker run -d --name kong-ci --network host \
            -e PORT=8080 \
            -e BACKEND_UPSTREAM_URL=http://127.0.0.1:8000 \
            g3-chatbot-gateway:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 2
          done
          docker logs kong-ci || true
          cat uvicorn.log || true
          exit 1
      - name: Run gateway integration tests
        env:
          GATEWAY_TEST_URL: http://127.0.0.1:8080
        run: python -m pytest tests/integration/test_gateway_kong.py -v
      - name: Dump logs on failure
        if: failure()
        run: |
          docker logs kong-ci || true
          cat uvicorn.log || true
      - name: Stop Kong container
        if: always()
        run: docker rm -f kong-ci || true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependencies
        uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  sonar:
    name: SonarCloud
    needs: [scope, validate, unit-tests, integration-tests, coverage-merge]
    if: |
      always() && needs.scope.outputs.run_sonar == 'true' &&
      needs.validate.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (needs.coverage-merge.result == 'success' || needs.coverage-merge.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin SONAR_TOKEN (PR de Dependabot o fork): se omite SonarCloud."
          fi
      - name: Download coverage reports
        if: steps.token.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: SonarCloud scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Enforce zero new issues (MINOR+)
        if: steps.token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--pull-request "${{ github.event.pull_request.number }}")
          else
            args+=(--branch "${{ github.ref_name }}")
          fi
          python scripts/ci/sonar_gate_report.py \
            --project-key g3-chatbot-backend "${args[@]}" \
            --fail-on-severity MINOR \
            --output sonar-strict-gate.md
      - name: Explain quality gate failure
        if: failure() && steps.token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--pull-request "${{ github.event.pull_request.number }}")
          else
            args+=(--branch "${{ github.ref_name }}")
          fi
          python scripts/ci/sonar_gate_report.py \
            --project-key g3-chatbot-backend "${args[@]}" \
            --output sonar-gate-report.md
      - name: Upload Sonar gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-gate-reports
          path: sonar-*.md
          if-no-files-found: ignore
          retention-days: 30

  specs:
    name: Specs del PR
    needs: scope
    if: needs.scope.outputs.run_specs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar spec enlazada
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git clone --depth 1 --branch development https://github.com/Taller-SW-Web/G3-Chatbot-specs.git specs-repo
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python scripts/check_specs.py --base "origin/${{ github.base_ref }}" --specs-repo specs-repo --body "$RUNNER_TEMP/pr-body.md"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

  notify:
    name: Notify failure
    needs:
      - scope
      - validate
      - unit-tests
      - integration-tests
      - coverage-merge
      - docker
      - security
      - dast
      - gateway-integration
      - dependency-review
      - sonar
      - specs
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comment the failure on the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SCOPE_REASON: ${{ needs.scope.outputs.reason }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/notify_failure.py
      - name: Upload notification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-report
          path: ci-failure.md
          if-no-files-found: ignore
          retention-days: 30

  # `test` is the required status check. It runs even when a job fails so a
  # skipped required check cannot count as passed, and it verifies that every
  # job the scope asked for actually succeeded.
  test:
    name: test
    needs:
      - scope
      - validate
      - unit-tests
      - integration-tests
      - coverage-merge
      - docker
      - security
      - dast
      - gateway-integration
      - dependency-review
      - sonar
      - specs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every expected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_VALIDATE: ${{ needs.scope.outputs.run_validate }}
          RUN_UNIT: ${{ needs.scope.outputs.run_unit }}
          RUN_INTEGRATION: ${{ needs.scope.outputs.run_integration }}
          RUN_DOCKER: ${{ needs.scope.outputs.run_docker }}
          RUN_SECURITY: ${{ needs.scope.outputs.run_security }}
          RUN_DAST: ${{ needs.scope.outputs.run_dast }}
          RUN_GATEWAY: ${{ needs.scope.outputs.run_gateway }}
          RUN_SONAR: ${{ needs.scope.outputs.run_sonar }}
          RUN_SPECS: ${{ needs.scope.outputs.run_specs }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = [
              name
              for name, payload in needs.items()
              if payload.get("result") in {"failure", "cancelled"}
          ]
          if failed:
              print("Failed jobs: " + ", ".join(sorted(failed)))
              sys.exit(1)

          expected = {
              "validate": os.environ.get("RUN_VALIDATE"),
              "unit-tests": os.environ.get("RUN_UNIT"),
              "integration-tests": os.environ.get("RUN_INTEGRATION"),
              "docker": os.environ.get("RUN_DOCKER"),
              "security": os.environ.get("RUN_SECURITY"),
              "dast": os.environ.get("RUN_DAST"),
              "gateway-integration": os.environ.get("RUN_GATEWAY"),
              "sonar": os.environ.get("RUN_SONAR"),
              "specs": os.environ.get("RUN_SPECS"),
          }
          mismatched = [
              name
              for name, should_run in expected.items()
              if should_run == "true" and needs.get(name, {}).get("result") != "success"
          ]
          if mismatched:
              print("Jobs that should have run did not succeed: " + ", ".join(mismatched))
              sys.exit(1)
          print("All CI jobs passed or were intentionally skipped.")
          PY
