name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push on the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.17.2
      - name: Lint
        run: ruff check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install mypy
        run: pip install mypy
      - name: Type check
        run: mypy src

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit --cov=src --cov-report=xml --cov-report=term
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: error

  openapi:
    name: Export OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify committed OpenAPI is up to date
        run: python scripts/export_openapi.py --check
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py --output docs/openapi.json
      - name: Validate OpenAPI schema
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator docs/openapi.json
      - name: Upload OpenAPI schema artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: docs/openapi.json
          if-no-files-found: error

  integration-tests:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 18 for native uuidv7(), as the integration tests require.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Broker for the outbox relay tests (ADR-0030). Never CloudAMQP: load and CI runs
      # would burn its monthly quota.
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
      RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check migrations (upgrade, downgrade, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run integration tests
        # `--cov-fail-under=0`: este reporte no se evalúa solo. Sonar combina la
        # cobertura de integración con la de unitarias y el umbral se aplica una
        # vez sobre el total del proyecto.
        run: |
          python -m pytest tests/integration \
            --cov=src --cov-report=xml:coverage-integration.xml --cov-fail-under=0
      - name: Upload integration coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: error

  # Fase 4 de ADR-0024: el checker es bloqueante. Si falla, hay imports
  # cruzados entre módulos o falta la estructura obligatoria.
  modules:
    name: Module boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check modules manifest, MODULE.md, MODULE_ID and import boundaries
        run: python scripts/check_modules.py

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Gate bloqueante (H5-C1): una vulnerabilidad conocida en requirements.txt
      # tumba el job. No hay excepciones vigentes: si se necesitara una, se
      # documenta en docs/seguridad/pip-audit-exceptions.md y se ignora por ID,
      # nunca por paquete.
      - name: Audit requirements (blocking)
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt

  docker:
    name: Dockerfile + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # Solo bloquea errores; los estilos se revisan sin frenar el gate.
          failure-threshold: error
      - name: Trivy (vulnerabilidades y configuración)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Build image (equivalente al build del frontend)
        run: docker build --tag g3-chatbot-backend:ci .

  # H5-C2: DAST pasivo con OWASP ZAP contra el stack levantado en CI con módulos
  # fake y LLM_PROVIDER=fake (sin datos reales ni secretos). Falla solo ante
  # alertas High (`riskcode == 3`) sin excepción en `.zap/rules.tsv` y
  # `docs/seguridad/zap-exceptions.md`.
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_dast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare environment (fake modules and scripted LLM)
        run: |
          sed -e 's#^DATABASE_URL=.*#DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_dast#' \
              -e 's#^LLM_PROVIDER=.*#LLM_PROVIDER=fake#' \
              .env.template > .env
          alembic upgrade head
      - name: Start backend
        run: |
          nohup uvicorn src.infrastructure.main:app --host 127.0.0.1 --port 8000 --env-file .env \
            > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat uvicorn.log
          exit 1
      - name: Run OWASP ZAP baseline & OpenAPI passive scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            -v "$PWD/.zap:/zap/config:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://127.0.0.1:8000/openapi.json \
              -f openapi \
              -S \
              -c /zap/config/rules.tsv \
              -r zap-api-report.html \
              -J zap-api-report.json \
              -w zap-api-report.md || true
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            -v "$PWD/.zap:/zap/config:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:8000/health \
              -c /zap/config/rules.tsv \
              -r zap-health-report.html \
              -J zap-health-report.json \
              -w zap-health-report.md || true
      - name: Evaluate ZAP reports (fail on High findings)
        id: zap_gate
        run: |
          set +e
          python scripts/check_zap_report.py \
            --report zap-reports/zap-api-report.json \
            --report zap-reports/zap-health-report.json \
            --rules .zap/rules.tsv \
            --summary-output zap-reports/summary.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Publish ZAP summary
        if: always()
        run: |
          if [ -f zap-reports/summary.md ]; then
            cat zap-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload ZAP DAST reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-zap-report
          path: |
            zap-reports/
            uvicorn.log
          if-no-files-found: error
      - name: Enforce High-severity gate
        if: always()
        run: test "${{ steps.zap_gate.outputs.exit_code }}" = "0"

  # Revisa las dependencias que el PR agrega/cambia contra el Dependency Graph.
  # El job corre siempre (aunque en `push` no revisa nada) para no romper el
  # chequeo de `skipped` del gate.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Análisis de SonarCloud con la cobertura de unitarias e integración. El proyecto
  # espera el Quality Gate (`sonar.qualitygate.wait`), así que un gate rojo tumba el job.
  #
  # Los PRs de Dependabot se ejecutan como si vinieran de un fork: no reciben
  # secretos. Sin token el escaneo no puede autenticarse, así que se omite y el job
  # queda verde; la cobertura y el resto del gate siguen intactos.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin SONAR_TOKEN (PR de Dependabot): se omite SonarCloud."
          fi
      - name: Download coverage reports
        if: steps.token.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          # `coverage-backend` (unitarias) y `coverage-integration` aterrizan en la
          # raíz: Sonar los lee juntos y suma las líneas cubiertas por cualquiera.
          pattern: coverage-*
          merge-multiple: true
      - name: SonarCloud scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # `test` is the required status check of the protected branches, so it stays as the
  # single gate. It runs even when a job fails, because a skipped required check counts as passed.
  specs:
    name: Specs del PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: github.event_name == 'pull_request'
        with:
          python-version: '3.12'
      - name: Validar spec enlazada
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git clone --depth 1 --branch development https://github.com/Taller-SW-Web/G3-Chatbot-specs.git specs-repo
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python scripts/check_specs.py --base "origin/${{ github.base_ref }}" --specs-repo specs-repo --body "$RUNNER_TEMP/pr-body.md"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, types, unit-tests, openapi, integration-tests, modules, specs, security, dependency-review, docker, dast, sonar]
    if: always()
    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
