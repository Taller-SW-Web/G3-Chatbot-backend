name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push on the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.17.2
      - name: Lint
        run: ruff check .

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install mypy
        run: pip install mypy
      - name: Type check
        run: mypy src

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit --cov=src --cov-report=xml --cov-report=term
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: error

  openapi:
    name: Export OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py --output docs/openapi.json
      - name: Validate OpenAPI schema
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator docs/openapi.json
      - name: Upload OpenAPI schema artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: docs/openapi.json
          if-no-files-found: error

  integration-tests:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 18 for native uuidv7(), as the integration tests require.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check migrations (upgrade, downgrade, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run integration tests
        run: python -m pytest tests/integration

  # Advisory during Fase 2: a finding is reported but does not block the gate yet.
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit requirements (advisory)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            || echo "::warning::pip-audit encontró vulnerabilidades (advisory durante la Fase 2)"

  docker:
    name: Dockerfile + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          # Solo bloquea errores; los estilos se revisan sin frenar el gate.
          failure-threshold: error
      - name: Trivy (vulnerabilidades y configuración)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Build image (equivalente al build del frontend)
        run: docker build --tag g3-chatbot-backend:ci .

  # Revisa las dependencias que el PR agrega/cambia contra el Dependency Graph.
  # El job corre siempre (aunque en `push` no revisa nada) para no romper el
  # chequeo de `skipped` del gate.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Análisis de SonarCloud con la cobertura del job de unitarias. El proyecto espera
  # el Quality Gate (`sonar.qualitygate.wait`), así que un gate rojo tumba el job.
  #
  # Los PRs de Dependabot se ejecutan como si vinieran de un fork: no reciben
  # secretos. Sin token el escaneo no puede autenticarse, así que se omite y el job
  # queda verde; la cobertura y el resto del gate siguen intactos.
  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin SONAR_TOKEN (PR de Dependabot): se omite SonarCloud."
          fi
      - name: Download coverage
        if: steps.token.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
      - name: SonarCloud scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # `test` is the required status check of the protected branches, so it stays as the
  # single gate. It runs even when a job fails, because a skipped required check counts as passed.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, types, unit-tests, openapi, integration-tests, security, dependency-review, docker, sonar]
    if: always()
    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
