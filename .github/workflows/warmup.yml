name: Catalog warm-up

# G6 (Productos) escala a cero: la primera llamada tras un periodo idle tarda
# más que el timeout del backend y el catálogo devuelve 503. Este ping cada
# 5 minutos mantiene el gateway caliente para la primera carga real.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-warmup
  cancel-in-progress: true

jobs:
  warm:
    name: G6 catalog keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Productos
        run: |
          curl -fsS --retry 2 --retry-delay 5 --max-time 60 \
            "https://api-gateway.calmgrass-aec0b33c.chilecentral.azurecontainerapps.io/api/v1/productos?canal=CHATBOT&pagina=1&tamanio=1" \
            > /dev/null
