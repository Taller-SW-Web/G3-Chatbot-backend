name: Catalog warm-up

# G6 (Productos) escala a cero: la primera llamada tras un periodo idle tarda
# más que el timeout del backend y el catálogo devuelve 503. Este ping cada
# 5 minutos pega al catálogo del backend (busca, precios y disponibilidad en
# G6) con reintentos, así la primera carga real encuentra la cadena caliente.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # Railway publica deployment_status en cada despliegue; así el catálogo
  # queda caliente inmediatamente después de un deploy, no 5 min después.
  deployment_status:

permissions:
  contents: read

concurrency:
  group: catalog-warmup
  cancel-in-progress: true

jobs:
  warm:
    name: Catalog keep-alive
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Catálogo del backend
        run: |
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 60 \
            "https://g3-chatbot-backend.up.railway.app/api/v1/catalogo/productos?pagina=1&tamanio=1" \
            > /dev/null
