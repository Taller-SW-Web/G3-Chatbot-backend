target-version = "py312"
line-length = 120
# Merged migrations are never edited, not even for style.
extend-exclude = [".venv", "src/infrastructure/db/migrations/versions"]

[lint]
# Correctness (pyflakes), pycodestyle errors and warnings, import order and
# bugbear (patrones con bugs reales: B904, B905, B017...).
select = ["E", "F", "W", "I", "B"]
# Line length is not enforced yet: wrapping the existing long lines would touch most files.
# Complejidad (C90) no se activa aquí: Sonar la mide en el código nuevo, sin duplicar la señal.
ignore = ["E501"]

[lint.flake8-bugbear]
# FastAPI declara dependencias como llamadas en los defaults (`Depends()`, `Query()`):
# son inmutables por diseño, no el mutable-default de B008.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[lint.per-file-ignores]
# Models are imported in groups so Alembic autogenerate sees every table.
"src/adapters/outbound/persistence/models/__init__.py" = ["E402", "I001"]
